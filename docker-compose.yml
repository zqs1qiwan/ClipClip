services:
  clipclip:
    build: .
    container_name: clipclip
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CLIPCLIP_HOST: 0.0.0.0
      CLIPCLIP_PORT: 8080
      CLIPCLIP_DATA_DIR: /data
      CLIPCLIP_MAX_UPLOAD_MB: 50
      CLIPCLIP_PASTE_TTL_HOURS: 24
      CLIPCLIP_FILE_TTL_HOURS: 24
    volumes:
      - ./data:/data
