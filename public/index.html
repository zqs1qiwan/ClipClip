<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClipClip</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-row">
          <strong class="brand-name">ClipClip</strong>
          <span class="badge" id="connection-badge">Connecting</span>
        </div>

        <div class="toolbar">
          <div class="endpoint-box">
            <span class="endpoint-label" data-i18n="topbar.endpointLabel">Access</span>
            <code class="endpoint-value" id="endpoint-value">http://clip.clip:5678</code>
          </div>
          <div class="lang-switch" role="group" aria-label="Language">
            <button class="lang-button" type="button" data-lang="zh">&#20013;</button>
            <button class="lang-button is-active" type="button" data-lang="en">EN</button>
          </div>
        </div>
      </header>

      <nav class="tabbar" aria-label="ClipClip tools">
        <button class="tab-button is-active" type="button" data-tab="live" data-i18n="tabs.live">Clipboard</button>
        <button class="tab-button" type="button" data-tab="paste" data-i18n="tabs.paste">Share Link</button>
        <button class="tab-button" type="button" data-tab="files" data-i18n="tabs.files">Files</button>
      </nav>

      <main class="workspace">
        <section class="tool-panel" data-panel="live">
          <div class="panel-header">
            <h1 class="panel-title" data-i18n="live.title">Live Clipboard</h1>
            <div class="inline-actions">
              <button id="live-copy-button" class="secondary-button" type="button" data-i18n="actions.copy">Copy</button>
              <button id="live-clear-button" class="secondary-button" type="button" data-i18n="actions.clear">Clear</button>
              <button id="live-save-button" type="button" data-i18n="actions.sync">Sync</button>
            </div>
          </div>

          <textarea
            id="live-textarea"
            aria-label="Live clipboard"
            data-i18n-placeholder="live.placeholder"
            placeholder="Paste or type text here"
          ></textarea>

          <footer class="panel-footer">
            <span class="muted-text" id="live-updated-at">Waiting for first update.</span>
          </footer>
        </section>

        <section class="tool-panel" data-panel="paste" hidden>
          <div class="panel-header">
            <h1 class="panel-title" data-i18n="paste.title">Share Link</h1>
            <div class="inline-actions">
              <button id="paste-fill-live-button" class="secondary-button" type="button" data-i18n="actions.useLive">
                Use clipboard text
              </button>
              <button id="paste-create-button" type="button" data-i18n="actions.createLink">Create</button>
            </div>
          </div>

          <div class="split-layout">
            <div class="input-column">
              <textarea
                id="paste-textarea"
                aria-label="Paste source"
                data-i18n-placeholder="paste.placeholder"
                placeholder="Text for a fixed share link"
              ></textarea>
            </div>

            <aside class="result-box" id="paste-result">No share link yet.</aside>
          </div>
        </section>

        <section class="tool-panel" data-panel="files" hidden>
          <div class="panel-header">
            <h1 class="panel-title" data-i18n="file.title">File Transfer</h1>
          </div>

          <div class="files-shell">
            <div class="files-hero">
              <section class="file-box upload-panel">
                <label class="upload-box" for="file-input">
                  <input id="file-input" type="file" />
                  <span class="upload-title" data-i18n="file.dropTitle">Drop a file here</span>
                  <span class="upload-subtitle" id="file-input-label" data-i18n="file.select">Choose a file</span>
                </label>
                <div class="upload-actions">
                  <button id="file-browse-button" class="secondary-button" type="button" data-i18n="actions.choose">Choose</button>
                  <button id="file-upload-button" type="button" data-i18n="actions.upload">Upload</button>
                </div>
                <p class="muted-text selection-meta" id="file-selection-meta" data-i18n="file.selectHint">
                  Newest 10 files stay in the queue.
                </p>
                <div class="progress-track" aria-hidden="true">
                  <span id="upload-progress-bar"></span>
                </div>
                <p class="muted-text" id="upload-status" data-i18n="file.idle">Ready.</p>
              </section>

              <section class="latest-panel">
                <div class="section-head">
                  <strong data-i18n="file.latestTitle">Ready to download</strong>
                </div>
                <div class="result-box align-start file-current-box" id="file-current">No files in the queue yet.</div>
              </section>
            </div>

            <section class="history-panel">
              <div class="section-head">
                <strong data-i18n="file.queueTitle">Recent uploads</strong>
                <span class="muted-text" id="file-count">0 files</span>
              </div>
              <p class="muted-text history-empty-state" id="file-history-empty" data-i18n="file.historyEmpty">Upload history will appear here.</p>
              <ul class="history-list" id="file-history-list"></ul>
            </section>
          </div>
        </section>
      </main>
    </div>

    <template id="paste-view-template">
      <div class="paste-shell">
        <section class="tool-panel paste-panel">
          <div class="panel-header">
            <h1 class="panel-title" data-i18n="paste.viewTitle">Shared Paste</h1>
            <button id="paste-view-copy-button" type="button" data-i18n="actions.copy">Copy</button>
          </div>
          <pre id="paste-view-content"></pre>
          <p class="muted-text" id="paste-view-meta"></p>
        </section>
      </div>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>
